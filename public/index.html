<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>AT-ATs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="nav">
        <h1 id="nav_title">
            <div class="nav_title_box">aT</div>
            <div class="nav_title_box">aTS</div>
        </h1>
    </div>

    <div class="main_container">
        <div class="resume_drop_box">
            <div id="display_file">
                <div class="marquee_track">
                    <span class="marquee_content">
                        <span class="aurebesh">RESUME.md/pdf</span>
                        <span class="normal">RESUME.md/pdf</span>
                    </span>
                    <span class="marquee_content">
                        <span class="aurebesh">RESUME.md/pdf</span>
                        <span class="normal">RESUME.md/pdf</span>
                    </span>
                </div>
            </div>
            <button id="add_file_button" type="button">
                Upload Resume (PDF or MD)
            </button>
            <input id="hidden_file_input" type="file" accept=".pdf,.md">
        </div>
        <div class="resume_grade_container"></div>
    </div>

    <div class="footer">
        <p><i>We believe the future of hypergrowth requires the lossiest way for ATS to parse resumes.</i></p>
        <p>LLMs are trained on Markdown, so that is our preference.</p>
    </div>

    <script type="module" src="/index.js"></script>
</body>
</html>
