<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>ATs-ATs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            background-color: rgb(239, 237, 229);
        }
        #nav_title{
            display: flex;
            flex-direction: row;
            padding: 10px 0px 0px 10px;
        }
        .nav{
            display: flex;
            flex-direction: column;
            
            position: fixed;

            border-bottom: 1px solid black;
            top: 0;
            width: 100%;
        }
        .nav_title_box{
            height  : 90px;
            width   : 90px;
            
            margin  : 2px;
            
            text-align: center;
            line-height: 85px;
            
            border: 1px solid black;
            border-radius: 10px;
        }

        #nav_tagline{
            padding: 5px 0px 10px 10px;

            font-style: italic;
        }

        .main_container{
            display         : flex;
            align-items     : center;
            justify-content : center;

            padding-top: 200px;
        }

        .resume_drop_box{
            display         : flex;
            flex-direction  : column;
            align-items     : center;
            justify-content : center;

            background-color: rgb(15, 15, 15);
            border: 7px solid rgb(160, 160, 160);
            border-radius: 40px;
            box-shadow: 10px 10px 0 rgb(0, 0,0);

            width: fit-content;
            height: 200px;
            width: 400px;
        }

        #disiplay_file{
            all: unset;
            height: 100px;
            width: 300px;
            
            margin: 20px 0 0 0;

            border: 4px solid rgb(160, 160, 160);
            border-radius: 10px;

            background-color: rgba(0, 160, 255, .8);
        }

        #add_file_button{
            padding : 10px;
            margin  : 30px 0 20px 0;

            font-size: 20px;

            border        : 1px solid black;
            border-radius : 10px;

            background-color: white;
            transition: transform 150ms cubic-bezier(1, 0, 0, 1),  background-color 500ms ease-out;
        }

        #add_file_button:hover{
            transform       : scale(1.02);
            background-color: rgba(235, 33, 46, 0.900);
            border-color    : rgba(18, 18, 18, 0.806);
        }
        #add_file_button:active{
            transform: scale(0.99);
        }
        #hidden_file_input{
            display: none;
            border: 1px solid black;
        }
        .footer{
            width: 100%;

            padding: 10px;

            border-top: 1px solid black;
            position: fixed;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div class="nav">
        <h1 id="nav_title">
            <div class="nav_title_box">
                <span>A</span>
                <span>T</span>
            </div>
            <div class="nav_title_box">
                <span>A</span>
                <span>T</span>
                <span>s</span>
            </div>
        </h1>
        <p id="nav_tagline">The smarter way to parse resumes</p>
    </div>

    <div class="main_container">
        <div class="resume_drop_box">
            <input id="disiplay_file" readonly>
            <button id="add_file_button" type="button" onclick="renderFilePicker()">
                Upload Resume (PDF or MD)
            </button>
            <input id="hidden_file_input" type="file" accept="text/pdf">
        </div>
        <script src="../dist/index.js"></script>
    </div>

    <div class="footer">
        <p><i>We believe that the future of hypergrowth requires the lossiest way for ATS to parse resumes</i></p>
        <p>LLMs are trained on Markdown language so that is our preference.</p>
    </div>
</body>


</html>
