<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>ATs-ATs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="nav">
        <h1 id="nav_title">
            <div class="nav_title_box">
                <span>a</span>
                <span>T</span>
            </div>
            <div class="nav_title_box">
                <span>a</span>
                <span>T</span>
                <span>S</span>
            </div>
        </h1>
        <p id="nav_tagline">The smarter way to parse resumes</p>
    </div>

    <div class="main_container">
        <div class="resume_drop_box">
            <div id="display_file">
                <div class="marquee-track">
                    <span class="marquee-content">
                        <span class="aurebesh">RESUME.md/pdf</span>
                        <span class="normal">&nbsp;RESUME.md/pdf&nbsp;&nbsp;&nbsp;</span>
                    </span>
                    <span class="marquee-content">
                        <span class="aurebesh">RESUME.md/pdf</span>
                        <span class="normal">&nbsp;RESUME.md/pdf&nbsp;&nbsp;&nbsp;</span>
                    </span>
                </div>
            </div>
            <button id="add_file_button" type="button">
                Upload Resume (PDF or MD)
            </button>
            <input id="hidden_file_input" type="file" accept="text/pdf">
        </div>
        <script type="module" src="../dist/index.js"></script>
    </div>

    <div class="footer">
        <p><i>We believe that the future of hypergrowth requires the lossiest way for ATS to parse resumes</i></p>
        <p>LLMs are trained on Markdown language so that is our preference.</p>
    </div>
</body>


</html>
